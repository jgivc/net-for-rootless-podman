#!/usr/sbin/nft -f

# This will erase all current rules
flush ruleset

define container_net = 172.16.0.0/24
define container_net_if = br0
define container_net_oif = eth0

table inet filter {
	chain input {
		type filter hook input priority filter;
		# iifname "$container_net_if" udp sport 68 udp dport 67 accept;
		# iifname "$container_net_if" udp dport 53 accept;
		# iifname "$container_net_if" tcp dport 53 accept;
	}
	chain forward {
		type filter hook forward priority filter;
		# iifname "$container_net_if" ip saddr $container_net accept
		# oifname "$container_net_if" ip daddr $container_net accept
	}
	chain output {
		type filter hook output priority filter;
	}
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        ip saddr $container_net oifname $container_net_oif masquerade
    }
}
